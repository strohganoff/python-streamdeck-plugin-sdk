name: Tests

on: 
  push:
    branches: [main]
    paths-ignore: ['*.md', '.gitignore']
  pull_request:
    types: [opened, synchronize, labeled]
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    if: github.event_name == 'push' ||
        ((github.event.action == 'opened' || github.event.action == 'synchronize') && contains(github.event.pull_request.labels.*.name, 'READY TO TEST')) ||
        (github.event.action == 'labeled' && github.event.label.name == 'READY TO TEST')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.6'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python '${{ matrix.python-version }}'
      - name: Test with pytest and python version
        run: uv run --locked --extra dev python -m pytest -p no:sugar --cov=streamdeck --cov-report=xml --cov-report=html --cov-report=term --junit-xml=reports/xunit-results.xml
      - name: Upload test coverage reports to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-reports-${{ matrix.python-version }}
          path: reports/
        if: ${{ always() }}
