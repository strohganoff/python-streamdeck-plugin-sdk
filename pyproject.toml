[build-system]
    requires = [
        "setuptools>=77.0.3",
    ]
    build-backend = "setuptools.build_meta"

[project]
    name = "streamdeck-plugin-sdk"
    dynamic = ["version"]
    description = "Write Streamdeck plugins using Python"
    readme = "README.md"
    authors = [
        { name = "strohganoff", email = "you@example.com" }
    ]
    license = "MIT"
    license-files = ["LICENSE"]
    keywords = [
        "python",
        "sdk",
        "streamdeck",
        "streamdeck_sdk",
        "streamdeck_plugin_sdk",
        "stream deck",
        "stream deck sdk",
        "stream deck plugin sdk",
        "streamdeck-sdk",
        "streamdeck-plugin-sdk",
        "stream-deck",
        "stream-deck-sdk",
        "stream-deck-plugin-sdk",
        "elgato",
        "elgato sdk",
        "elgato plugin",
        "elgato sdk",
        "elgato stream deck",
        "elgato stream deck sdk",
        "elgato stream deck plugin sdk",
    ]
    classifiers = [
        "Intended Audience :: Developers",
        "Operating System :: OS Independent",
        "Programming Language :: Python :: 3",
        "Programming Language :: Python",
        "Programming Language :: Python :: 3 :: Only",
        "Programming Language :: Python :: 3.9",
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Development Status :: 4 - Beta",
        "Environment :: MacOS X",
        "Intended Audience :: Developers",
        "Topic :: Software Development :: Libraries :: Application Frameworks",
        "Topic :: Software Development :: Libraries :: Python Modules",
        "Typing :: Typed",
    ]
    requires-python = ">=3.9"
    "dependencies" = [
    #     "jmespath >= 1.0.1",  # Upcoming pattern-filtering functionality
        "platformdirs >= 4.3.6",
        "pydantic >= 2.11",
        "pydantic_core >= 2.33",
        "websockets >= 13.1",
        "typer >= 0.15.1",
        "pydantic-settings[toml] >= 2.11",
    ]

    [project.urls]
        "Homepage" = "https://github.com/strohganoff/python-streamdeck-plugin-sdk"
        "Repository" = "https://github.com/strohganoff/python-streamdeck-plugin-sdk"
        "Documentation" = "https://docs.elgato.com/streamdeck/sdk/introduction/getting-started/"
        "Issues" = "https://github.com/strohganoff/python-streamdeck-plugin-sdk/issues"

    [project.scripts]
        streamdeck = "streamdeck.__main__:plugin"

[dependency-groups]
dev = [
    "polyfactory >= 2.17.0",  # Used for generating fake Stream Deck event data from the Pydantic event models.
    "pytest >= 8.3.3",
    "pytest-cov >= 5.0.0",
    "pytest-mock >= 3.14.0",
    "debugpy",
    "ruff >= 0.8.0",
    "mypy >= 1.14.0",
]
packaging = [
    "twine >= 6.1.0",
]


[tool.setuptools.packages.find]
    include = ["streamdeck*"]
    exclude = ["tests"]

[tool.setuptools.dynamic]
    version = {attr = "streamdeck.utils._version.MODULE_VERSION"}


# Add type annotations to your Python programs, and use mypy to type check them.
[tool.mypy]
    files                   = "streamdeck"
    ignore_missing_imports  = true
    pretty                  = true
    show_column_numbers     = true
    show_error_codes        = true
    show_error_context      = true
    strict                  = true
    warn_unreachable        = true


# Linting and code formatting
[tool.ruff]
    src=["streamdeck"]
    line-length=100 # Same as Black
    indent-width = 4
    target-version="py39"

    [tool.ruff.lint]
        preview=false
        fixable=["ALL"]

        select = [
            "A",         # flake8-builtins (shadowing Python builtins)
            "ANN",       # flake8-annotations (missing or disallowed type annotations)
            "ARG",       # flake8-unused-arguments (unused function parameters)
            "ASYNC",     # flake8-async (async programming pitfalls)
            "B",         # flake8-bugbear (bugs & design problems)
            "BLE",       # flake8-blind-except (overly broad exception catches)
            "C4",        # flake8-comprehensions (better list/set/dict comprehensions)
            "C90",       # McCabe (code complexity)
            "D",         # pydocstyle (documentation style)
            "DTZ",       # flake8-datetimez (naive datetime usage)
            "E",         # pycodestyle (errors and style conventions)
            "EM",        # flake8-errmsg (error messages)
            "ERA",       # eradicate (commented-out code)
            "EXE",       # flake8-executable (executable permissions and shebangs)
            "F",         # Pyflakes (undefined names, unused imports, and related checks)
            "FA",        # flake8-future-annotations (postponed annotation opportunities)
            "FBT",       # flake8-boolean-trap (boolean positional parameters and arguments)
            "FIX",       # flake8-fixme (FIXME, TODO, and similar comment markers)
            "FLY",       # flynt (f-strings)
            "G",         # flake8-logging-format (logging format strings)
            "I",         # isort (import order)
            "ICN",       # flake8-import-conventions (how certain packages should be imported or aliased)
            "INP",       # flake8-no-pep420 (missing __init__.py files)
            "INT",       # flake8-gettext (formatting translation strings before lookup)
            "ISC",       # flake8-implicit-str-concat (implicit string concatenation)
            "LOG",       # flake8-logging (logging)
            "N",         # pep8-naming (naming conventions)
            "PERF",      # PerFlint (performance linter for anti-patterns)
            "PGH",       # pygrep-hooks (miscellaneous lints, e.g. "use specific rule codes when using noqa")
            "PIE",       # flake8-pie (miscellaneous lints)
            "PL",        # Pylint (static code analyser)
            "PT",        # flake8-pytest-style (style issues or inconsistencies with pytest-based tests)
            "PTH",       # flake8-use-pathlib (prefer pathlib over equivalent APIs)
            "PYI",       # flake8-pyi (type stub and typing conventions)
            "Q",         # flake8-quotes (quote style and unnecessary escapes)
            "RET",       # flake8-return (return statement patterns)
            "RSE",       # flake8-raise (improvements for raise statements)
            "RUF",       # ruff (ruff specific rules)
            "S",         # flake8-bandit (security)
            "SIM",       # flake8-simplify (tips to simplify the code)
            "SLF",       # flake8-self (access to private members)
            "SLOT",      # flake8-slots (missing __slots__ in certain subclasses)
            "T10",       # flake8-debugger (debugger imports and calls)
            "T20",       # flake8-print (no print nor pprint)
            "TC",        # flake8-type-checking (runtime versus type-only imports)
            "TD",        # flake8-todos (todos)
            "TID",       # flake8-tidy-imports (banned imports and relative import conventions)
            "TRY",       # tryceratops (exception handling patterns)
            "UP",        # pyupgrade (upgrade syntax for newer versions of Python)
            "W",         # pycodestyle (warnings)
            "YTT",       # flake8-2020 (misuse of sys.version and sys.version_info)
        ]

        ignore = [
            "ANN204",    # Allow special methods, including __init__, without return annotations.
            "B024",      # Allow ABC subclasses without abstract methods or properties.
            "E501",      # Do not enforce line length in the linter; the formatter uses line-length.
            "ISC001",    # Avoid conflicts with Ruff formatting of single-line string concatenation.
            "TD002",     # Do not require an author in TODO comments.
            "TD003",     # Do not require an issue link in TODO comments.
        ]

        # Report these rules, but leave their fixes to manual review.
        unfixable = [
            "ERA",       # Keep commented-out code for manual review rather than deleting it automatically.
            "F841",      # Preserve unused assignments for manual review, including debugging helpers.
            "RET504",    # Preserve assignments immediately before return, which can aid debugging.
        ]

        [tool.ruff.lint.per-file-ignores]
            "tests/*" = [
                "ARG",       # Allow unused test parameters, including injected fixtures.
                "S101",      # Allow assertions in tests.
                "S106",      # Allow dummy password values passed as keyword arguments in tests.
                "S311",      # Allow noncryptographic random values in tests, such as port numbers.
                "SLF001",    # Allow tests to inspect private members.
                "ANN002",    # Allow unannotated *args in test helpers.
                "ANN003",    # Allow unannotated **kwargs in test helpers.
                "ANN201",    # Allow public test functions without return annotations.
                "ANN202",    # Allow private test helpers without return annotations.
                "FBT001",    # Allow boolean-typed positional parameters in test functions.
                "FBT002",    # Allow boolean default values for positional test parameters.
            ]

        [tool.ruff.lint.mccabe]
            max-complexity = 25

        [tool.ruff.lint.pydocstyle]
            convention = "google"

        [tool.ruff.lint.pylint]
            max-args=10

        [tool.ruff.lint.isort]
            known-first-party = ["streamdeck"]
            lines-after-imports = 2

    [tool.ruff.format]
        preview = false
        quote-style = "double"
        indent-style = "space"
        skip-magic-trailing-comma = false
        line-ending = "auto"
        docstring-code-format = true
        docstring-code-line-length = "dynamic"


[tool.pytest.ini_options]
    minversion = "6.0"
    addopts = "--color=yes --strict-markers --strict-config"
    markers = ["unit", "integration"]
    testpaths = ["tests"]


[tool.coverage.run]  # Configure coverage.py to measure branch coverage and specify source files to be measured.
    branch = true  # Enable branch coverage
    source = ["streamdeck"]  # Specify the source files for coverage.

[tool.coverage.report]
    skip_empty = true
    omit = ["tests/*"]  # Exclude test files from the coverage report.

[tool.coverage.html]
    directory = "reports/htmlcov"

[tool.coverage.xml]
    output = "reports/coverage-results.xml"
    # skip_covered = true

[tool.coverage.lcov]
    output = "reports/lcov.info"
